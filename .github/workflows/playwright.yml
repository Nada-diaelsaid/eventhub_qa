name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  playwright-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit
          path: test-results/junit.xml
          retention-days: 30
  playwright-report:
    if: ${{ always() && needs.playwright-test.result != 'cancelled' }}
    needs: playwright-test
    runs-on: ubuntu-latest
    steps:
      - name: Download JUnit report
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-junit
          path: test-results
      - name: Publish Playwright summary
        if: steps.download-report.outcome == 'success'
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: test-results/junit.xml
          summary-report: true
          integrations-config: |
            {
              "junit-to-ctrf": {
                "enabled": true,
                "action": "convert",
                "options": {
                  "output": "ctrf-report.json",
                  "toolname": "playwright",
                  "useSuiteName": false
                }
              }
            }
